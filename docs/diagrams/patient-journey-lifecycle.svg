<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="569px" preserveAspectRatio="none" style="width:1088px;height:569px;background:#FFFFFF;" version="1.1" viewBox="0 0 1088 569" width="1088px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="286.0189" x="397.7146" y="24.9659">Patient Journey Lifecycle - State Diagram</text></g><g class="entity" data-qualified-name="ACTIVE" data-source-line="9" id="ent0001"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="66.5078" x="291.67" y="284.5679"/><line style="stroke:#181818;stroke-width:0.5;" x1="291.67" x2="358.1778" y1="313.6358" y2="313.6358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.5078" x="301.67" y="304.5339">ACTIVE</text></g><g class="entity" data-qualified-name="SUSPENDED" data-source-line="10" id="ent0002"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="100.7237" x="603.67" y="70.5679"/><line style="stroke:#181818;stroke-width:0.5;" x1="603.67" x2="704.3937" y1="99.6358" y2="99.6358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7237" x="613.67" y="90.5339">SUSPENDED</text></g><g class="entity" data-qualified-name="COMPLETED" data-source-line="11" id="ent0003"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="101.8577" x="781.17" y="480.5679"/><line style="stroke:#181818;stroke-width:0.5;" x1="781.17" x2="883.0277" y1="509.6358" y2="509.6358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81.8577" x="791.17" y="500.5339">COMPLETED</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="13" id="ent0004"><ellipse cx="38.17" cy="95.5679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="19" id="ent0010"><ellipse cx="608.17" cy="505.5679" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="608.17" cy="505.5679" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN13" data-source-line="23" id="ent0014"><path d="M740.17,46.0679 L740.17,91.5679 L704.86,95.5679 L740.17,99.5679 L740.17,144.598 A0,0 0 0 0 740.17,144.598 L990.4902,144.598 A0,0 0 0 0 990.4902,144.598 L990.4902,56.0679 L980.4902,46.0679 L740.17,46.0679 A0,0 0 0 0 740.17,46.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M980.4902,46.0679 L980.4902,56.0679 L990.4902,56.0679 L980.4902,46.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.9542" x="746.17" y="64.9649">Step dates shift dynamically by</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.9422" x="746.17" y="82.6709">totalPausedDays + currentPauseDays</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.7172" x="746.17" y="100.377">(computeTotalPauseShift; no store</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.3202" x="746.17" y="118.083">write until resumeJourney, which also</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.4732" x="746.17" y="135.789">re-dates the journey's Instructions)</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="31" id="ent0017"><path d="M394.17,260.0679 L394.17,305.5679 L358.69,309.5679 L394.17,313.5679 L394.17,358.598 A0,0 0 0 0 394.17,358.598 L645.7252,358.598 A0,0 0 0 0 645.7252,358.598 L645.7252,270.0679 L635.7252,260.0679 L394.17,260.0679 A0,0 0 0 0 394.17,260.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M635.7252,260.0679 L635.7252,270.0679 L645.7252,270.0679 L635.7252,260.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.5552" x="400.17" y="278.9649">Late enrolment (joinedAt &gt; startDate):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.7812" x="400.17" y="296.6709">closed-window steps get system</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.0872" x="400.17" y="314.377">REMOVE_STEP modifications and past</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.7012" x="400.17" y="332.083">instructions are created CANCELLED</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.1462" x="400.17" y="349.789">(cancelReason = LATE_JOIN).</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="39" id="ent0020"><path d="M133.17,456.0679 L133.17,554.598 L425.6232,554.598 L425.6232,466.0679 L415.6232,456.0679 L133.17,456.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M415.6232,456.0679 L415.6232,466.0679 L425.6232,466.0679 L415.6232,456.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.1462" x="139.17" y="474.9649">Phase progression is handled by</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.7022" x="139.17" y="492.6709">startNextPhase(...): previous journey</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.8353" x="139.17" y="510.377">becomes COMPLETED and a new journey is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4532" x="139.17" y="528.083">created in the same episode with phaseType</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.3292" x="139.17" y="545.789">and transition (fromJourneyId, trigger).</text></g><!--link *start* to ACTIVE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" data-link-type="dependency" data-source-line="13" id="lnk5"><path d="M34.68,105.1779 C25.97,128.1979 6,191.9579 35.17,230.0679 C66.47,270.9679 217.122,294.8414 286.602,303.9014" fill="none" id="*start*-to-ACTIVE" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="291.56,304.5479,283.1528,299.4178,286.602,303.9014,282.1183,307.3506,291.56,304.5479" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.6112" x="36.17" y="198.9649">assignPatientJourney / startNextPhase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.9082" x="43.5215" y="216.6709">(pausedAt=null, totalPausedDays=0)</text></g><!--link ACTIVE to SUSPENDED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="15" id="lnk6"><path d="M345.1,284.5379 C353.76,275.5579 364.57,266.0979 376.17,260.0679 C436.1,228.9079 469.23,267.9279 525.17,230.0679 C549.36,213.6979 541.8,196.9379 561.17,175.0679 C579.1,154.8179 598.4003,138.2638 617.1703,123.6938" fill="none" id="ACTIVE-to-SUSPENDED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="621.12,120.6279,611.5578,122.9868,617.1703,123.6938,616.4633,129.3063,621.12,120.6279" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.6941" x="598.726" y="198.9649">pauseJourney</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8062" x="562.17" y="216.6709">(records pausedAt=now())</text></g><!--link SUSPENDED to ACTIVE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="16" id="lnk7"><path d="M603.49,100.4479 C516.29,108.2979 343.7,129.3479 307.17,175.0679 C282.21,206.3079 296.4978,250.8507 310.1578,279.9907" fill="none" id="SUSPENDED-to-ACTIVE" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="312.28,284.5179,312.0818,274.6711,310.1578,279.9907,304.8381,278.0667,312.28,284.5179" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.2621" x="365.773" y="189.9649">resumeJourney</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.4682" x="308.17" y="207.6709">(totalPausedDays += elapsedDays,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.9881" x="366.41" y="225.377">pausedAt=null)</text></g><!--link ACTIVE to COMPLETED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="17" id="lnk8"><path d="M346.07,334.9179 C354.63,343.6079 365.12,352.7879 376.17,359.0679 C419.11,383.4679 435.94,374.6379 483.17,389.0679 C589.68,421.6079 708.4124,461.8202 776.2324,485.1702" fill="none" id="ACTIVE-to-COMPLETED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="780.96,486.7979,773.7524,480.0859,776.2324,485.1702,771.1481,487.6502,780.96,486.7979" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimi