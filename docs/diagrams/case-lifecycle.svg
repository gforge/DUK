<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1005px" preserveAspectRatio="none" style="width:839px;height:1005px;background:#FFFFFF;" version="1.1" viewBox="0 0 839 1005" width="839px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="209.5512" x="311.6362" y="24.9659">Case Lifecycle - State Diagram</text></g><g class="entity" data-qualified-name="NEW" data-source-line="9" id="ent0001"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="51.4439" x="238.5" y="127.0679"/><line style="stroke:#181818;stroke-width:0.5;" x1="238.5" x2="289.9439" y1="156.1358" y2="156.1358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.4439" x="248.5" y="147.0339">NEW</text></g><g class="entity" data-qualified-name="NEEDS_REVIEW" data-source-line="10" id="ent0002"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="120.7716" x="214.5" y="274.0679"/><line style="stroke:#181818;stroke-width:0.5;" x1="214.5" x2="335.2716" y1="303.1358" y2="303.1358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.7716" x="224.5" y="294.0339">NEEDS_REVIEW</text></g><g class="entity" data-qualified-name="TRIAGED" data-source-line="11" id="ent0003"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="78.3798" x="475" y="403.0679"/><line style="stroke:#181818;stroke-width:0.5;" x1="475" x2="553.3798" y1="432.1358" y2="432.1358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.3798" x="485" y="423.0339">TRIAGED</text></g><g class="entity" data-qualified-name="FOLLOWING_UP" data-source-line="12" id="ent0004"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="127.3236" x="697.5" y="550.0679"/><line style="stroke:#181818;stroke-width:0.5;" x1="697.5" x2="824.8236" y1="579.1358" y2="579.1358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3236" x="707.5" y="570.0339">FOLLOWING_UP</text></g><g class="entity" data-qualified-name="CLOSED" data-source-line="13" id="ent0005"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="72.8078" x="357.5" y="809.5679"/><line style="stroke:#181818;stroke-width:0.5;" x1="357.5" x2="430.3078" y1="838.6358" y2="838.6358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.8078" x="367.5" y="829.5339">CLOSED</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="15" id="ent0006"><ellipse cx="264" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN16" data-source-line="26" id="ent0017"><path d="M465.5,679.0679 L465.5,830.5679 L430.56,834.5679 L465.5,838.5679 L465.5,990.0702 A0,0 0 0 0 465.5,990.0702 L790.2063,990.0702 A0,0 0 0 0 790.2063,990.0702 L790.2063,689.0679 L780.2063,679.0679 L465.5,679.0679 A0,0 0 0 0 465.5,679.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M780.2063,679.0679 L780.2063,689.0679 L790.2063,689.0679 L780.2063,679.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2252" x="471.5" y="697.9649">VALID_TRANSITIONS enforced in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.1671" x="471.5" y="715.6709">src/api/service/cases.ts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="471.5" y="733.377">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9153" x="471.5" y="751.083">NEEDS_REVIEW is the patient-initiated path:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.3882" x="471.5" y="768.789">the patient submitted a form or asked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.5542" x="471.5" y="786.495">for contact, requiring clinician review.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="471.5" y="804.201">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.3453" x="471.5" y="821.907">NEW &#8594; TRIAGED / CLOSED is the clinician-</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.4932" x="471.5" y="839.6131">initiated path for passive patients who</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.7892" x="471.5" y="857.3191">have not yet opened the app.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="471.5" y="875.0251">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.9942" x="471.5" y="892.7311">triageCase is blocked while LAB/XRAY</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3842" x="471.5" y="910.4371">reviews are pending. Colleague reviews</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.7241" x="471.5" y="928.1431">are advisory and never block.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="471.5" y="945.8492">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.7063" x="471.5" y="963.5552">claimCaseAssignment (TRIAGED/FOLLOWING_UP)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.7773" x="471.5" y="981.2612">sets the owner without changing status.</text></g><!--link *start* to NEW--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M264,66.0779 C264,79.9579 264,102.0379 264,121.9079" fill="none" id="*start*-to-NEW" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="264,126.9079,268,117.9079,264,121.9079,260,117.9079,264,126.9079" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NEW to NEEDS_REVIEW--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="16" id="lnk8"><path d="M261.13,177.1179 C259.43,195.5179 258.12,221.4879 261,244.0679 C262.26,253.9679 263.4323,259.8202 265.9923,269.0402" fill="none" id="NEW-to-NEEDS_REVIEW" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="267.33,273.8579,268.7764,264.1158,265.9923,269.0402,261.068,266.2561,267.33,273.8579" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4592" x="262" y="221.9649">"submitFormResponse / seekContact</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.8251" x="306.317" y="239.6709">(patient active in app)"</text></g><!--link NEW to TRIAGED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="17" id="lnk9"><path d="M289.72,155.4579 C343.59,161.0379 465.48,176.7679 492,207.0679 C540.41,262.3779 529.695,353.1459 520.715,397.8359" fill="none" id="NEW-to-TRIAGED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="519.73,402.7379,525.4246,394.7023,520.715,397.8359,517.5814,393.1263,519.73,402.7379" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.408" x="563.4966" y="295.4649">"triageCase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.4011" x="528" y="313.1709">(patient not yet active)"</text></g><!--link NEW to CLOSED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" data-link-type="dependency" data-source-line="18" id="lnk10"><path d="M238.32,155.3879 C173.06,162.8279 6,192.2279 6,298.0679 C6,298.0679 6,298.0679 6,576.0679 C6,743.8279 256.0002,807.8625 352.5902,826.4625" fill="none" id="NEW-to-CLOSED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="357.5,827.4079,349.4187,821.7782,352.5902,826.4625,347.906,829.6339,357.5,827.4079" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.3312" x="7" y="433.4649">"triageCase / contactMode=CLOSE"</text></g><!--link NEEDS_REVIEW to TRIAGED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="19" id="lnk11"><path d="M319.66,324.1779 C346.17,338.4579 380.46,356.8679 411,373.0679 C432.05,384.2379 451.1396,394.2603 470.3896,404.3303" fill="none" id="NEEDS_REVIEW-to-TRIAGED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="474.82,406.6479,468.6993,398.9319,470.3896,404.3303,464.9911,406.0205,474.82,406.6479" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="