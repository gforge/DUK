<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="871px" preserveAspectRatio="none" style="width:994px;height:871px;background:#FFFFFF;" version="1.1" viewBox="0 0 994 871" width="994px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="301.8249" x="342.9782" y="24.9659">Research Consent Lifecycle - State Diagram</text></g><g class="entity" data-qualified-name="GRANTED" data-source-line="8" id="ent0001"><rect fill="#F1F1F1" height="58.1358" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="84.2737" x="50" y="280.0679"/><line style="stroke:#181818;stroke-width:0.5;" x1="50" x2="134.2737" y1="328.2038" y2="328.2038"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.2737" x="60" y="300.0339">GRANTED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.6478" x="60" y="319.1018">(active)</text></g><g class="entity" data-qualified-name="REVOKED" data-source-line="9" id="ent0002"><rect fill="#F1F1F1" height="58.1358" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="161.5674" x="7" y="634.0679"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="168.5674" y1="682.2038" y2="682.2038"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.4957" x="17" y="654.0339">REVOKED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.5674" x="17" y="673.1018">(withdrawn, terminal)</text></g><g class="entity" data-qualified-name="DECLINED" data-source-line="10" id="ent0003"><rect fill="#F1F1F1" height="58.1358" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="87.5777" x="489" y="280.0679"/><line style="stroke:#181818;stroke-width:0.5;" x1="489" x2="576.5777" y1="328.2038" y2="328.2038"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.5777" x="499" y="300.0339">DECLINED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.9518" x="499" y="319.1018">(terminal)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="12" id="ent0004"><ellipse cx="312" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="18" id="ent0008"><ellipse cx="310" cy="846.0679" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="310" cy="846.0679" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" data-source-line="22" id="ent0012"><path d="M169,251.0679 L169,305.0679 L134.35,309.0679 L169,313.0679 L169,367.304 A0,0 0 0 0 169,367.304 L452.9252,367.304 A0,0 0 0 0 452.9252,367.304 L452.9252,261.0679 L442.9252,251.0679 L169,251.0679 A0,0 0 0 0 169,251.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M442.9252,251.0679 L442.9252,261.0679 L452.9252,261.0679 L442.9252,251.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.1621" x="175" y="269.9649">Idempotency:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.9991" x="175" y="287.6709">If an active Consent already exists</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.9252" x="175" y="305.377">for the same (patientId, researchModuleId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.5962" x="175" y="323.083">patientJourneyId), grantConsent returns</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.8162" x="175" y="340.789">the existing record without creating</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.4471" x="175" y="358.495">a duplicate.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="31" id="ent0015"><path d="M204,552.0679 L204,659.0679 L169.36,663.0679 L204,667.0679 L204,774.5401 A0,0 0 0 0 204,774.5401 L480.1902,774.5401 A0,0 0 0 0 480.1902,774.5401 L480.1902,562.0679 L470.1902,552.0679 L204,552.0679 A0,0 0 0 0 204,552.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M470.1902,552.0679 L470.1902,562.0679 L480.1902,562.0679 L470.1902,552.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.6042" x="210" y="570.9649">The record is NEVER deleted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.1902" x="210" y="588.6709">revokedAt, revokedByUserId and optional</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.4992" x="210" y="606.377">withdrawalReason are set for audit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.9331" x="210" y="624.083">purposes (GCP ICH E6).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.2652" x="210" y="641.789">hasActiveConsent() returns false.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.38" x="210" y="659.495">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.9951" x="210" y="677.201">A new call to grantConsent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.7271" x="210" y="694.907">after revocation creates a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.2491" x="210" y="712.6131">fresh Consent record.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.4052" x="210" y="730.3191">Both the revoked and the new</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.2471" x="210" y="748.0251">record are preserved in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.2372" x="210" y="765.7311">AppState.researchConsents.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="46" id="ent0018"><path d="M633.5,268.5679 L633.5,349.392 L892.6992,349.392 L892.6992,278.5679 L882.6992,268.5679 L633.5,268.5679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M882.6992,268.5679 L882.6992,278.5679 L892.6992,278.5679 L882.6992,268.5679" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.1992" x="639.5" y="287.4649">A decline is recorded as a Consent with</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.6002" x="639.5" y="305.1709">revokedAt equal to grantedAt, which</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9722" x="639.5" y="322.877">distinguishes it from a post-consent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71.3051" x="639.5" y="340.583">withdrawal.</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="53" id="ent0021"><path d="M586.5,622.5679 L586.5,703.392 L979.7813,703.392 L979.7813,632.5679 L969.7813,622.5679 L586.5,622.5679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M969.7813,622.5679 L969.7813,632.5679 L979.7813,632.5679 L969.7813,622.5679" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.9042" x="592.5" y="641.4649">Service: src/api/service/researchConsents.ts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.8552" x="592.5" y="659.1709">Storage: AppState.researchConsents[]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.2813" x="592.5" y="676.877">UI: src/components/journey/ConsentDialog/ (Grant, Decline),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.5963" x="606.02" y="694.583">src/components/journey/RevokeConsentDialog.tsx</text></g><!--link *start* to GRANTED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" data-link-type="dependency" data-source-line="12" id="lnk5"><path d="M305.89,64.0479 C278.61,95.1579 170.4857,218.5178 120.1657,275.9278" fill="none" id="*start*-to-GRANTED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="116.87,279.6879,125.8104,275.5563,120.1657,275.9278,119.7942,270.2832,116.87,279.6879" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.6851" x="294.264" y="110.9649">grantConsent(</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.2801" x="311.8465" y="128.6709">patientId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.4531" x="283.76" y="146.377">researchModuleId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.0931" x="288.44" y="164.083">patientJourneyId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.6241" x="289.1745" y="181.789">grantedByUserId</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.9" x="336.1565" y="199.495">)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8241" x="283.1945" y="217.201">grantedAt = now()</text></g><!--link *start* to DECLINED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="14" id="lnk6"><path d="M321.8,58.8679 C340.5,62.7379 381.71,73.3879 408,96.0679 C467.68,147.5679 504.4952,230.2697 521.3952,275.0697" fill="none" id="*start*-to-DECLINED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="523.16,279.7479,523.726,269.9153,521.3952,275.0697,516.2409,272.739,523.16,279.7479" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.9421" x="554.1405" y="119.4649">declineConsent(</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.1132" x="517.435" y="137.1709">patientId, researchModuleId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.4632" x="504.76" y="154.877">patientJourneyId, userId, reason?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.9" x="601.1616" y="172.583">)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.4001" x="545.9115" y="190.289">(no active consent)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4592" x="509.882" y="207.995">grantedAt = revokedAt = now()</text></g><!--link GRANTED to REVOKED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="16" id="lnk7"><path d="M91.68,338.2779 C90.93,404.1879 89.1268,562.6782 88.3768,628.7282" fill="none" id="GRANTED-to-REVOKED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="88.32,633.7279,92.4219,624.7739,88.3768,628.7282,84.4224,624.6831,88.32,633.7279" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.7451" x="150.3961" y="411.9649">revokeConsent(</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.3111" x="169.4931" y="429.6709">consentId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.8361" x="147.2306" y="447.377">revokedByUserId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.762" x="177.7676" y="465.083">reason?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.9" x="196.3186" y="482.789">)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.1572" x="95.38" y="500.495">or declineConsent (active consent)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.5521" x="142.9926" y="518.201">revokedAt = now()</text></g><!--link REVOKED to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" data-source-line="18" id="lnk9"><path d="M108.8,692.1279 C127.3,715.8379 156.01,749.7379 186,774.0679 C224.34,805.1679 273.4388,828.7695 295.4388,838.6495" fill="none" id="REVOKED-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="300,840.6979,293.4286,8