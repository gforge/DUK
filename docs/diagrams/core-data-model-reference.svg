14" lengthAdjust="spacing" textLength="86.5476" x="959.5806" y="150.3055">YYYY-MM-DD</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.2757" x="1053.4082" y="150.3055">Anchor date</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.0717" x="959.5806" y="169.3734">ISO datetime</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.3375" x="1053.4082" y="169.3734">Persisted timestamp</text><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="1216.8856" y1="59.0679" y2="59.0679"/><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="1216.8856" y1="78.1358" y2="78.1358"/><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="1216.8856" y1="97.2038" y2="97.2038"/><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="1216.8856" y1="116.2717" y2="116.2717"/><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="1216.8856" y1="135.3396" y2="135.3396"/><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="1216.8856" y1="154.4075" y2="154.4075"/><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="1216.8856" y1="173.4754" y2="173.4754"/><line style="stroke:#000000;stroke-width:1;" x1="955.9406" x2="955.9406" y1="59.0679" y2="173.4754"/><line style="stroke:#000000;stroke-width:1;" x1="1049.7682" x2="1049.7682" y1="59.0679" y2="173.4754"/><line style="stroke:#000000;stroke-width:1;" x1="1216.8856" x2="1216.8856" y1="59.0679" y2="173.4754"/></g><g class="entity" data-qualified-name="JourneyTemplateRef" data-source-line="25" id="ent0001"><path d="M6,368.9754 L6,467.5055 L395.0953,467.5055 L395.0953,378.9754 L385.0953,368.9754 L6,368.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M385.0953,368.9754 L385.0953,378.9754 L395.0953,378.9754 L385.0953,368.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.1951" x="12" y="387.8724">JourneyTemplate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.5273" x="12" y="405.5784">- parentTemplateId?: lineage to parent template</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.5042" x="12" y="423.2845">- derivedAt?: last parent sync timestamp</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.7032" x="12" y="440.9905">- referenceDateLabel: visible assignment anchor label</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.0953" x="12" y="458.6965">- group? + phaseOrder?: multi-phase care pathway grouping</text></g><g class="entity" data-qualified-name="JourneyEntryRef" data-source-line="33" id="ent0002"><path d="M455,377.9754 L455,458.7995 L828.4172,458.7995 L828.4172,387.9754 L818.4172,377.9754 L455,377.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M818.4172,377.9754 L818.4172,387.9754 L828.4172,387.9754 L818.4172,377.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.1491" x="461" y="396.8724">JourneyTemplateEntry</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.8532" x="461" y="414.5784">- offsetDays + windowDays drive due windows</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.4172" x="461" y="432.2845">- scoreAliases maps raw score keys to stable policy aliases</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.0283" x="461" y="449.9905">- recurrenceIntervalDays enables recurring occurrences</text></g><g class="entity" data-qualified-name="FormResponseRef" data-source-line="40" id="ent0003"><path d="M888,377.9754 L888,458.7995 L1238.4333,458.7995 L1238.4333,387.9754 L1228.4333,377.9754 L888,377.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1228.4333,377.9754 L1228.4333,387.9754 L1238.4333,387.9754 L1228.4333,377.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.2341" x="894" y="396.8724">FormResponse</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.7642" x="894" y="414.5784">- patientJourneyId?: runtime journey context</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.4333" x="894" y="432.2845">- journeyTemplateEntryId?: originating template entry</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4272" x="894" y="449.9905">- occurrenceIndex?: recurring instance index</text></g><g class="entity" data-qualified-name="ConsentRef" data-source-line="47" id="ent0004"><path d="M1785,360.4754 L1785,476.7115 L2164.8262,476.7115 L2164.8262,370.4754 L2154.8262,360.4754 L1785,360.4754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2154.8262,360.4754 L2154.8262,370.4754 L2164.8262,370.4754 L2154.8262,360.4754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.401" x="1791" y="379.3724">Consent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.5673" x="1791" y="397.0784">- grantedAt / grantedByUserId always set on grant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.6882" x="1791" y="414.7845">- revokedAt / revokedByUserId set on revoke</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.5733" x="1791" y="432.4905">- one active consent per patient+module+journey</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.8262" x="1791" y="450.1965">- withdrawalReason?: free-text reason on withdraw/decline</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.3252" x="1791" y="467.9025">- revoked records are retained for audit history</text></g><g class="entity" data-qualified-name="TriageDecisionRef" data-source-line="56" id="ent0005"><path d="M23.5,199.4754 L23.5,333.4175 L377.4693,333.4175 L377.4693,209.4754 L367.4693,199.4754 L23.5,199.4754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M367.4693,199.4754 L367.4693,209.4754 L377.4693,209.4754 L367.4693,199.4754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.4841" x="29.5" y="218.3724">Case.triageDecision</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.6393" x="29.5" y="236.0784">- contactMode: DIGITAL | PHONE | VISIT | CLOSE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.5283" x="29.5" y="253.7845">- careRole / assignmentMode null for CLOSE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.3054" x="29.5" y="271.4905">- assignmentMode: ANY | PAL | NAMED | TEAM</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.8992" x="29.5" y="289.1965">- PAL requires careRole DOCTOR</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.4812" x="29.5" y="306.9025">- NAMED: assignedUserId or assignedUserIds[]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.9693" x="29.5" y="324.6085">- TEAM: assignedTeamIds[] -&gt; CareTeam shared queue</text></g><g class="entity" data-qualified-name="CaseReviewRef" data-source-line="66" id="ent0006"><path d="M463.5,225.9754 L463.5,306.7995 L819.3802,306.7995 L819.3802,235.9754 L809.3802,225.9754 L463.5,225.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M809.3802,225.9754 L809.3802,235.9754 L819.3802,235.9754 L809.3802,225.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.884" x="469.5" y="244.8724">Case reviews</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.8323" x="469.5" y="262.5784">- reviews[]: LAB/XRAY results; pending blocks triage</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.2272" x="469.5" y="280.2845">- colleagueReviews[]: advisory second opinion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.1202" x="476.26" y="297.9905">(reviewerUserId, question?, respondedAt?, response?)</text></g><g class="entity" data-qualified-name="ReferralRef" data-source-line="73" id="ent0007"><path d="M932,225.9754 L932,306.7995 L1194.1632,306.7995 L1194.1632,235.9754 L1184.1632,225.9754 L932,225.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1184.1632,225.9754 L1184.1632,235.9754 L1194.1632,235.9754 L1184.1632,225.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.8471" x="938" y="244.8724">EpisodeOfCare.referral?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.9161" x="938" y="262.5784">- receivedAt, referrer, reason</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.8372" x="938" y="280.2845">- diagnoses[]: { code, text }</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1632" x="938" y="297.9905">- diagnosisSource?: UTHOPP | MANUAL</text></g><g class="entity" data-qualified-name="InstructionRef" data-source-line="80" id="ent0008"><path d="M1298,377.9754 L1298,458.7995 L1725.1465,458.7995 L1725.1465,387.9754 L1715.1465,377.9754 L1298,377.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1715.1465,377.9754 L1715.1465,387.9754 L1725.1465,387.9754 L1715.1465,377.9754" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.9501" x="1304" y="396.8724">Instruction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.8912" x="1304" y="414.5784">- startDayOffset/endDayOffset stored from template</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2373" x="1304" y="432.2845">- startAt/endAt persisted and shifted on journey resume</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.1465" x="1304" y="449.9905">- status: ACTIVE -&gt; ACKNOWLEDGED -&gt; COMPLETED or CANCELLED</text></g><!--link JourneyTemplateRef to JourneyEntryRef--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="association" data-source-line="86" id="lnk9"><path codeLine="86" d="M395.21,418.4754 C415.06,418.4754 435.18,418.4754 454.94,418.4754" fill="none" id="JourneyTemplateRef-JourneyEntryRef" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link JourneyEntryRef to FormResponseRef--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="association" data-source-line="87" id=